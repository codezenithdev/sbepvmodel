# Render service definition for the SB Energy dashboard backend.
#
# Codifies what docs/RENDER_DEPLOYMENT.md describes in prose so the deployment is
# reviewable in git. Values marked `sync: false` are set in the Render dashboard
# and must never be committed.
#
# Blueprint docs: https://render.com/docs/blueprint-spec

services:
  # Must match the existing service exactly. Render matches a blueprint service by
  # name, so a different name here does not update srv-d96lfcfavr4c73a1fc60: it
  # creates a second service alongside it, with an empty disk and none of the
  # sync:false secrets. Verify with `render blueprints validate ./render.yaml`
  # before connecting this file, and read the planned service list in the output.
  - type: web
    name: sbepvmodel
    runtime: python
    region: oregon
    # DRIFT, unresolved on purpose. The running service reports instance type
    # 1c-2g while this file still declares the older `starter`. Connecting the
    # blueprint could therefore resize the instance and restart it. Confirm the
    # correct plan value in the Render dashboard and set it here before the first
    # sync; do not guess, because the wrong value downgrades a live service.
    plan: starter
    healthCheckPath: /healthz

    buildCommand: pip install -r requirements.txt
    # --app-dir puts src/ on sys.path so `sbepv` resolves without an install step.
    # The running service currently hardcodes `--port 8000` instead of $PORT. This
    # form is the correct one and a sync would replace the hardcoded port, so the
    # drift is deliberate here rather than copied back from the live service.
    startCommand: uvicorn sbepv.api.main:app --app-dir src --host 0.0.0.0 --port $PORT

    disk:
      name: outputs
      mountPath: /var/data
      sizeGB: 5

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14

      # Generated runs must land on the persistent disk, not the ephemeral
      # filesystem. The agent SQLite database lives under this path too.
      - key: PV_DASHBOARD_OUTPUT_DIR
        value: /var/data/outputs

      # Keep human authority disabled until automated and live-shadow evidence is
      # reviewed. Disabling shadow mode is a deliberate post-checklist change.
      - key: DECISION_AGENT_SHADOW_MODE
        value: "true"
      - key: DECISION_AGENT_BEHAVIOR_EVAL_CASES
        value: "0"

      # Secrets: set in the Render dashboard.
      - key: BAZEFIELD_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHBOARD_BASIC_USER
        sync: false
      - key: DASHBOARD_BASIC_PASSWORD
        sync: false

    # Deliberately unset, documented here so the omissions are visible:
    #
    #   OPENAI_MODEL                   defaults in the code; set only if the chat
    #                                  smoke test reports a model-access error
    #   BAZEFIELD_BASE_URL             defaults to the production Bazefield host
    #   PV_DASHBOARD_ALLOWED_ORIGINS   CORS allowlist; add the Sites URL when the
    #                                  hosted dashboard calls this API directly
    #   PV_DASHBOARD_ENABLE_LEGACY_RUN leave unset so every calibration run must
    #                                  pass through the data-quality review
